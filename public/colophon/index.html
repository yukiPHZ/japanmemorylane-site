    <h1>写真と言葉の、静かな記憶。</h1>
    <div class="colophon-copy">
      <p>Japan Memory Laneは、旅先の案内ではなく、日本に残る小さな光景や感触を、写真と短い言葉のあいだに置く場所です。</p>
      <p>急いで説明せず、記憶が記憶のままでいられる余白を残すために作っています。</p>
      <p>制作しているのは、菊田 幸彦（Yukihiko Kikuta）です。写真と言葉を通して、日本の静かな記憶を残しています。</p>
